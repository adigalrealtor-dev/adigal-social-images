name: Daily Instagram Post

on:
  schedule:
    # Market/news post: 8:30 AM America/New_York during daylight saving time.
    - cron: '30 12 * * *'
    # Mortgage post: 11:00 AM America/New_York during daylight saving time.
    - cron: '0 15 * * *'
    # MLS listing post: 3:30 PM America/New_York during daylight saving time.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Optional: market, listing, or mortgage'
        required: false
        type: string
      dry_run:
        description: 'Generate image/caption without publishing'
        required: true
        default: true
        type: boolean
      destinations:
        description: 'Optional: instagram, facebook, or instagram,facebook'
        required: false
        default: 'instagram,facebook'
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Publish daily Instagram post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          BRIDGE_ACCESS_TOKEN: ${{ secrets.BRIDGE_ACCESS_TOKEN }}
          BRIDGE_CLIENT_ID: ${{ secrets.BRIDGE_CLIENT_ID }}
          BRIDGE_CLIENT_SECRET: ${{ secrets.BRIDGE_CLIENT_SECRET }}
          BRIDGE_DATASET_ID: ${{ secrets.BRIDGE_DATASET_ID }}
          BRIDGE_AGENT_ID: ${{ secrets.BRIDGE_AGENT_ID }}
          BRIDGE_API_BASE: ${{ secrets.BRIDGE_API_BASE }}
          BRIDGE_NATIVE_API_BASE: ${{ secrets.BRIDGE_NATIVE_API_BASE }}
          BRIDGE_AUTH_MODE: ${{ secrets.BRIDGE_AUTH_MODE }}
          BRIDGE_FILTER: ${{ secrets.BRIDGE_FILTER }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://adigal-social-images.vercel.app' }}
          POST_TYPE: ${{ inputs.post_type || (github.event.schedule == '30 12 * * *' && 'market') || (github.event.schedule == '0 15 * * *' && 'mortgage') || (github.event.schedule == '30 19 * * *' && 'listing') || 'market' }}
          POST_SLOT: ${{ (github.event.schedule == '30 12 * * *' && '0830') || (github.event.schedule == '0 15 * * *' && '1100') || (github.event.schedule == '30 19 * * *' && '1530') || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          POST_DESTINATIONS: ${{ inputs.destinations || 'instagram,facebook' }}
        run: node scripts/post-daily-instagram.js
